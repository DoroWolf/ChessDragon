# ============================================================
# 开局库线路定义（Opening Lines）
# ------------------------------------------------------------
# 坐标约定：[row, col]
#   row 0 = 黑方底线（第 8 横线），row 7 = 白方底线（第 1 横线）
#   col 0 = a 列，col 7 = h 列
#   例如 [6, 4] = e2，[4, 4] = e4；f = from（起点），t = to（终点）
# 最低 AI 强度等级：仅当 AI 强度 >= minLevel 时才会采用该线路
#
# 生成命令：node scripts/generateOpeningBook.ts
#           -> 输出 src/data/openingBook.json
# ============================================================

