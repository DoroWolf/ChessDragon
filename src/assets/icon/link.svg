<svg xmlns="http://www.w3.org/2000/svg"
     width="32" height="32"
     viewBox="0 0 32 32"
     shape-rendering="crispEdges">
  <!-- 右环（内缘留出缺口，营造与左环互相扣合的观感） -->
  <rect x="16" y="12" width="12" height="1" fill="currentColor"/>
  <rect x="16" y="20" width="12" height="1" fill="currentColor"/>
  <rect x="27" y="13" width="1" height="7" fill="currentColor"/>
  <rect x="16" y="13" width="1" height="2" fill="currentColor"/>
  <rect x="16" y="18" width="1" height="2" fill="currentColor"/>
  <!-- 左环 -->
  <rect x="4" y="12" width="12" height="1" fill="currentColor"/>
  <rect x="4" y="20" width="12" height="1" fill="currentColor"/>
  <rect x="4" y="13" width="1" height="7" fill="currentColor"/>
  <rect x="15" y="13" width="1" height="2" fill="currentColor"/>
  <rect x="15" y="18" width="1" height="2" fill="currentColor"/>
</svg>
